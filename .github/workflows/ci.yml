name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
      # expose repo root as an import path for tests
      PYTHONPATH: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          # project deps; add yfinance/pyarrow if/when you use them in CI
          pip install pandas requests
          # dev/test tools
          pip install pytest ruff black isort

      - name: Editable install (if pyproject.toml present)
        run: |
          if [ -f "pyproject.toml" ]; then
            pip install -e .
          fi

      - name: Ruff (lint)
        run: |
          ruff check mf tests || (echo "::warning::Ruff found issues"; exit 1)

      - name: Black (format check)
        run: |
          black --check mf tests

      - name: isort (import order)
        run: |
          isort --profile black --check mf tests

      - name: Run tests
        run: |
          # run only the live ECB test for now
          pytest -q tests/live/test_ecb_usdeur_live.py
