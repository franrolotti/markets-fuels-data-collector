[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "markets-fuels"
version = "0.1.0"
authors = [
{ name = "Volatility Spillovers" }
]
description = "Collect and normalize daily markets & fuels series for Europe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
"pandas>=2.2",
"numpy>=1.26",
"typer>=0.12",
"requests>=2.32",
"yfinance>=0.2",
"pandera>=0.20",
"pyarrow>=16.0",
"python-dateutil>=2.9"
]


[project.scripts]
mf = "mf.cli:app"


[tool.typer]
pretty_exceptions_show_locals = true